description: 'Eval for the tools/code-review review agent — model comparison + regression checks on a known-flawed diff'

providers:
  - id: file://./provider.ts
    label: review-agent-gpt-5.4-nano
    config:
      model: gpt-5.4-nano
  - id: file://./provider.ts
    label: review-agent-gpt-5-mini
    config:
      model: gpt-5-mini

prompts:
  - '{{diff}}'

tests:
  - description: 'Injection + missing-test diff should score low and fail'
    vars:
      diff: file://./fixtures/injection-no-tests.diff
    assert:
      - type: is-json
      - type: javascript
        value: file://./assertions/assertValidSchema.ts
      - type: javascript
        value: file://./assertions/assertBadDiffFails.ts
      - type: llm-rubric
        value: 'The review correctly identifies both that the diff introduces a PostgREST filter-injection vulnerability via unsanitized string interpolation, and that no test was added for the new code.'
        provider: openai:gpt-5-mini
