name: 'AI Code Reviewer'
description: >-
  Runs the scripted code-review agent (tools/code-review/review.ts) against a PR
  diff and reports the result as a PR comment + ai-cr:* label.
inputs:
  pr-number:
    description: 'Pull request number to review'
    required: true
  pr-title:
    description: 'Pull request title'
    required: true
  pr-body:
    description: 'Pull request description/body (may be empty)'
    required: true
  github-token:
    description: 'Token used for gh CLI calls (comments, labels)'
    required: true
  openai-api-key:
    description: 'OpenAI API key for the review agent'
    required: true
  consumed-review-label:
    description: "'true' to remove the ai-cr:review trigger label after this run"
    required: true
outputs:
  verdict:
    description: 'pass | fail | error'
    value: ${{ steps.run-review.outputs.classification }}
runs:
  using: composite
  steps:
    - name: Assemble review input (title + body + diff)
      id: build-input
      shell: bash
      env:
        PR_TITLE: ${{ inputs.pr-title }}
        PR_BODY: ${{ inputs.pr-body }}
      run: |
        git diff origin/main...HEAD > /tmp/ai-cr-diff.txt
        {
          printf 'PR Title: %s\n\n' "$PR_TITLE"
          printf 'PR Description:\n%s\n\n' "${PR_BODY:-(no description provided)}"
          printf -- '---\n\n'
          cat /tmp/ai-cr-diff.txt
        } > /tmp/ai-cr-input.txt

    - name: Run code-review agent
      id: run-review
      shell: bash
      env:
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
      run: |
        set +e
        npm run review:ci --silent < /tmp/ai-cr-input.txt > /tmp/ai-cr-output.json 2> /tmp/ai-cr-error.log
        rc=$?
        set -e

        classification=error
        if [ "$rc" -eq 0 ] && jq -e '.verdict == "pass" or .verdict == "fail"' /tmp/ai-cr-output.json > /dev/null 2>&1; then
          classification=$(jq -r '.verdict' /tmp/ai-cr-output.json)
        fi
        echo "classification=$classification" >> "$GITHUB_OUTPUT"

    - name: Update state labels
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        CLASSIFICATION: ${{ steps.run-review.outputs.classification }}
        CONSUMED_REVIEW_LABEL: ${{ inputs.consumed-review-label }}
      run: |
        gh label create "ai-cr:passed" --color "2ea44f" --description "AI code review: passed" --force
        gh label create "ai-cr:failed" --color "d73a4a" --description "AI code review: failed" --force

        if [ "$CLASSIFICATION" = "pass" ]; then
          gh pr edit "$PR_NUMBER" --add-label "ai-cr:passed" --remove-label "ai-cr:failed"
        elif [ "$CLASSIFICATION" = "fail" ]; then
          gh pr edit "$PR_NUMBER" --add-label "ai-cr:failed" --remove-label "ai-cr:passed"
        fi

        if [ "$CONSUMED_REVIEW_LABEL" = "true" ]; then
          gh pr edit "$PR_NUMBER" --remove-label "ai-cr:review"
        fi

    - name: Post or update PR comment
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        CLASSIFICATION: ${{ steps.run-review.outputs.classification }}
      run: |
        MARKER='<!-- ai-cr-comment -->'

        if [ "$CLASSIFICATION" = "error" ]; then
          {
            echo "$MARKER"
            echo '### 🤖 AI Code Review — could not complete'
            echo
            echo "The review agent failed to run or returned an unexpected result. This doesn't reflect on the PR's quality — the review itself didn't finish, so no label was changed."
            echo
            echo '<details><summary>Error details</summary>'
            echo
            echo '```'
            tail -c 4000 /tmp/ai-cr-error.log 2>/dev/null || echo '(no error output captured)'
            echo '```'
            echo '</details>'
          } > /tmp/ai-cr-comment.md
        else
          verdict=$(jq -r '.verdict' /tmp/ai-cr-output.json)
          summary=$(jq -r '.summary' /tmp/ai-cr-output.json)
          correctness=$(jq -r '.scores.correctness' /tmp/ai-cr-output.json)
          idiomaticity=$(jq -r '.scores.idiomaticity' /tmp/ai-cr-output.json)
          complexity=$(jq -r '.scores.complexity' /tmp/ai-cr-output.json)
          test_coverage=$(jq -r '.scores.testCoverage' /tmp/ai-cr-output.json)
          security=$(jq -r '.scores.security' /tmp/ai-cr-output.json)

          icon='✅'
          [ "$verdict" = "fail" ] && icon='❌'

          {
            echo "$MARKER"
            echo "### $icon AI Code Review — verdict: \`$verdict\`"
            echo
            echo '| Criterion | Score (1-10) |'
            echo '| --- | --- |'
            echo "| Correctness | $correctness |"
            echo "| Idiomaticity | $idiomaticity |"
            echo "| Complexity | $complexity |"
            echo "| Test coverage | $test_coverage |"
            echo "| Security | $security |"
            echo
            echo "$summary"
          } > /tmp/ai-cr-comment.md
        fi

        existing_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
          --jq '[.[] | select(.body | contains("<!-- ai-cr-comment -->"))][0].id // empty')

        if [ -n "$existing_id" ]; then
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing_id}" -F "body=@/tmp/ai-cr-comment.md"
        else
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F "body=@/tmp/ai-cr-comment.md"
        fi

    - name: Gate on verdict
      shell: bash
      env:
        CLASSIFICATION: ${{ steps.run-review.outputs.classification }}
      run: |
        if [ "$CLASSIFICATION" != "pass" ]; then
          echo "AI review classification: $CLASSIFICATION — failing the check."
          exit 1
        fi
        echo "AI review passed."
